name: Publish refusal observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-refusal-observatory.yml'
      - 'interactive/web/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_SLUG: observatory-ee7be89d0e5a2bfe4a4fab83
  PAGES_BASE_PATH: /refusal_audit_v2/observatory-ee7be89d0e5a2bfe4a4fab83/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed site and its LFS data
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: interactive/web/package-lock.json

      - name: Install exact dependencies
        working-directory: interactive/web
        run: npm ci

      - name: Build the static observatory
        working-directory: interactive/web
        run: npm run build:pages

      - name: Assemble the unlisted Pages artifact
        run: |
          mkdir -p "_site/${SITE_SLUG}"
          cp -R interactive/web/dist/pages/. "_site/${SITE_SLUG}/"
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
